name: CI

# The app runs as a Node server (Canvas LTI 1.3 needs server routes), so it is no longer
# deployed to GitHub Pages. This checks that every push and pull request lints and builds;
# deploy with any Node host that runs `npm run build && npm start` (see src-llama/CANVAS.md).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src-llama

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./src-llama/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
